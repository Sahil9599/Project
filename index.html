<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocuMorph - Photo & PDF Batch Converter</title>
    <meta name="description" content="Minimalist Photo to PDF and PDF to Photo batch conversion studio with custom high-grade compression, personal cloud storage, conversion history, and privacy-first user accounts." />
    <meta property="og:title" content="DocuMorph - Photo & PDF Batch Converter" />
    <meta property="og:description" content="Minimalist Photo to PDF and PDF to Photo batch conversion studio with custom high-grade compression, personal cloud storage, conversion history, and privacy-first user accounts." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="text-slate-900 antialiased font-sans selection:bg-blue-600 selection:text-white">
    <!-- SVG Filter for Liquid Glass Refraction Effect -->
    <svg style="position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none;" aria-hidden="true">
      <defs>
        <filter id="glass-distortion">
          <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
